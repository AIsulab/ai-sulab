const { useState, useEffect, useRef, useMemo } = React;

function Icon({ name, className = "w-5 h-5", strokeWidth = 1.75 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const key = name.replace(/(^|-)(\w)/g, (_, __, c) => c.toUpperCase());
      const svg = window.lucide.createElement(window.lucide.icons[key] || window.lucide.icons.Circle);
      svg.setAttribute("class", className);
      svg.setAttribute("stroke-width", strokeWidth);
      ref.current.appendChild(svg);
    }
  }, [name, className, strokeWidth]);
  return <span ref={ref} className="inline-flex" />;
}

function StatCard({ label, value, delta, deltaDir = "up", icon, tone="violet", spark }) {
  const tones = {
    violet:   "bg-violet-100 text-violet-700",
    emerald:  "bg-emerald-100 text-emerald-700",
    fuchsia:  "bg-fuchsia-100 text-fuchsia-700",
    sky:      "bg-sky-100 text-sky-700",
    amber:    "bg-amber-100 text-amber-700",
  };
  return (
    <div className="bg-white rounded-2xl ring-1 ring-slate-200 p-5 hover:shadow-sm transition">
      <div className="flex items-start justify-between">
        <div>
          <div className="text-[12px] text-slate-500 font-medium">{label}</div>
          <div className="font-display font-extrabold text-[26px] mt-2 font-mono-num tracking-tight">{value}</div>
        </div>
        <div className={`w-9 h-9 rounded-xl ${tones[tone]} flex items-center justify-center`}>
          <Icon name={icon} className="w-4 h-4"/>
        </div>
      </div>
      <div className="mt-2 flex items-center justify-between">
        <span className={`inline-flex items-center gap-1 text-[12px] font-semibold ${deltaDir==="up"?"text-emerald-600":"text-rose-600"}`}>
          <Icon name={deltaDir==="up"?"trending-up":"trending-down"} className="w-3.5 h-3.5"/> {delta}
        </span>
        {spark && <MiniSpark data={spark} dir={deltaDir}/>}
      </div>
    </div>
  );
}

function MiniSpark({ data, dir }) {
  const w = 80, h = 26;
  const max = Math.max(...data), min = Math.min(...data);
  const step = w / (data.length-1);
  const path = data.map((v,i) => `${i===0?"M":"L"} ${i*step} ${h - ((v-min)/Math.max(1,max-min))*h*0.9 - 2}`).join(" ");
  const color = dir==="up" ? "#059669" : "#E11D48";
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} aria-hidden="true">
      <path d={path} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round"/>
    </svg>
  );
}

function RevenueChart() {
  // monthly series
  const months = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
  const mrr = [70, 78, 86, 90, 96, 105, 112, 120, 126, 134, 142, 148];
  const newR = [12, 14, 16, 14, 18, 22, 20, 24, 22, 26, 28, 30];
  const churn = [3, 4, 6, 4, 8, 7, 9, 8, 10, 9, 11, 10];
  const w = 600, h = 220, pad = 32;
  const max = 170;
  const step = (w - pad*2) / (months.length-1);

  const linePath = (arr) => arr.map((v,i) => `${i===0?"M":"L"} ${pad+i*step} ${h-pad - (v/max)*(h-pad*2)}`).join(" ");
  const areaPath = (arr) => linePath(arr) + ` L ${pad+(arr.length-1)*step} ${h-pad} L ${pad} ${h-pad} Z`;

  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full mt-4 overflow-visible">
      <defs>
        <linearGradient id="grVio" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor="#7C3AED" stopOpacity="0.35"/>
          <stop offset="100%" stopColor="#7C3AED" stopOpacity="0"/>
        </linearGradient>
      </defs>
      {/* horizontal grid */}
      {[0,1,2,3,4].map(i => (
        <g key={i}>
          <line x1={pad} x2={w-pad} y1={pad + i*((h-pad*2)/4)} y2={pad + i*((h-pad*2)/4)} stroke="#F1F5F9"/>
          <text x={pad-8} y={pad + i*((h-pad*2)/4)+3} textAnchor="end" fill="#94A3B8" fontSize="10">{Math.round((max - i*(max/4)))}M</text>
        </g>
      ))}
      {/* churn bars (negative) */}
      {churn.map((v,i) => (
        <rect key={i} x={pad+i*step-4} y={h-pad} width="8" height={(v/max)*(h-pad*2)*0.4} fill="#E2E8F0" rx="2"/>
      ))}
      {/* new revenue bars */}
      {newR.map((v,i) => (
        <rect key={i} x={pad+i*step-4} y={h-pad - (v/max)*(h-pad*2)*0.6} width="8" height={(v/max)*(h-pad*2)*0.6} fill="#F0ABFC" rx="2"/>
      ))}
      {/* MRR area + line */}
      <path d={areaPath(mrr)} fill="url(#grVio)"/>
      <path d={linePath(mrr)} fill="none" stroke="#7C3AED" strokeWidth="2.5"/>
      {mrr.map((v,i) => (
        <circle key={i} cx={pad+i*step} cy={h-pad-(v/max)*(h-pad*2)} r={i===mrr.length-1?4:2.5} fill={i===mrr.length-1?"#7C3AED":"white"} stroke="#7C3AED" strokeWidth="2"/>
      ))}
      {/* x labels */}
      {months.map((m,i) => (
        <text key={m} x={pad+i*step} y={h-pad+15} textAnchor="middle" fill="#94A3B8" fontSize="10">{m}</text>
      ))}
    </svg>
  );
}

function PlanDonut() {
  const segs = [
    { v: 42, c: "#CBD5E1" },  // starter
    { v: 38, c: "#7C3AED" },  // pro
    { v: 16, c: "#F472B6" },  // team
    { v: 4,  c: "#10B981" },  // enterprise
  ];
  const r = 56, sw = 18, cx = 80, cy = 80;
  const C = 2 * Math.PI * r;
  let acc = 0;
  return (
    <svg width="160" height="160" viewBox="0 0 160 160" className="mx-auto mt-2">
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#F1F5F9" strokeWidth={sw}/>
      {segs.map((s,i) => {
        const len = (s.v/100)*C;
        const dash = `${len} ${C-len}`;
        const offset = -acc * (C/100);
        acc += s.v;
        return (
          <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.c} strokeWidth={sw}
                  strokeDasharray={dash} strokeDashoffset={offset}
                  transform={`rotate(-90 ${cx} ${cy})`} strokeLinecap="butt"/>
        );
      })}
      <text x={cx} y={cy-4} textAnchor="middle" fontSize="11" fill="#64748B">전체</text>
      <text x={cx} y={cy+18} textAnchor="middle" fontSize="22" fontWeight="800" fill="#0F172A" style={{fontVariantNumeric:"tabular-nums"}}>10,084</text>
    </svg>
  );
}

            <div key={svc.n} className="rounded-xl ring-1 ring-slate-200 px-3.5 py-3 flex items-center gap-3">
              <div className={`w-9 h-9 rounded-lg flex items-center justify-center
                ${svc.s==='operational'?'bg-emerald-50 text-emerald-600':svc.s==='degraded'?'bg-amber-50 text-amber-600':'bg-rose-50 text-rose-600'}`}>
                <Icon name={svc.s==='operational'?'check':svc.s==='degraded'?'alert-triangle':'x'} className="w-4 h-4"/>
              </div>
              <div className="flex-1 min-w-0">
                <div className="text-[13.5px] font-semibold text-slate-900 truncate">{svc.n}</div>
                <div className="text-[11.5px] text-slate-500 mt-0.5">가동률 {svc.up} · 응답 {svc.lat}</div>
              </div>
              {chip(svc.s)}
            </div>
          ))}
        </div>
      </div>

      <div className="bg-white rounded-2xl ring-1 ring-slate-200 p-5">
        <div className="flex items-center justify-between">
          <div>
            <div className="font-display font-bold text-[15px]">최근 90일 가동률</div>
            <div className="text-[12px] text-slate-500">하루 1칸 · 색상은 상태</div>
          </div>
          <div className="flex items-center gap-3 text-[11px] text-slate-500">
            <span className="inline-flex items-center gap-1"><span className="w-2 h-2 rounded-sm bg-emerald-500"></span>정상</span>
            <span className="inline-flex items-center gap-1"><span className="w-2 h-2 rounded-sm bg-amber-500"></span>저하</span>
            <span className="inline-flex items-center gap-1"><span className="w-2 h-2 rounded-sm bg-rose-500"></span>장애</span>
          </div>
        </div>
        <div className="mt-4 flex gap-[3px] flex-wrap">
          {days.map((s,i) => (
            <span key={i} title={`Day ${90-i}: ${s}`}
              className={`h-7 w-[7px] rounded-sm
                ${s==='operational'?'bg-emerald-500':s==='degraded'?'bg-amber-500':'bg-rose-500'}`}></span>
          ))}
        </div>
        <div className="mt-3 flex items-center justify-between text-[11px] text-slate-400 font-mono-num">
          <span>90일 전</span>
          <span>오늘</span>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// PLACEHOLDER TAB
// ============================================================
function PlaceholderTab({ title, desc, icon }) {
  return (
    <div className="space-y-6 fade-up">
      <PageHeader title={title} desc={desc}/>
      <div className="bg-white rounded-2xl ring-1 ring-slate-200 p-16 text-center">
        <div className="mx-auto w-14 h-14 rounded-2xl bg-violet-100 text-violet-700 flex items-center justify-center">
          <Icon name={icon} className="w-6 h-6"/>
        </div>
        <div className="font-display font-bold text-[18px] mt-5">곧 제공될 예정입니다</div>
        <p className="text-slate-500 text-[13.5px] mt-1.5 max-w-[400px] mx-auto">
          이 화면은 다음 릴리스에서 활성화됩니다. 데이터 구조와 흐름은 확정되어 있습니다.
        </p>
        <button className="mt-5 inline-flex items-center gap-1.5 h-10 px-4 rounded-lg bg-violet-600 hover:bg-violet-700 text-white text-[13px] font-semibold transition">
          <Icon name="bell" className="w-3.5 h-3.5"/> 출시 알림 받기
        </button>
      </div>
    </div>
  );
}

// ============================================================
// APP
// ============================================================
function App() {
  const [tab, setTab] = useState("overview");
  return (
    <div className="min-h-screen">
      <SulabNav active="admin"/>
      <main className="px-3 lg:px-6 pt-6 pb-12" data-screen-label={`02 Admin ${tab}`}>
        <div className="max-w-[1320px] mx-auto flex gap-5 items-start">
          <AdminSidebar tab={tab} setTab={setTab}/>
          <div className="flex-1 min-w-0">
            {tab === "overview"  && <OverviewTab/>}
            {tab === "users"     && <UsersTab/>}
            {tab === "billing"   && <BillingTab/>}
            {tab === "system"    && <SystemTab/>}
            {tab === "workspaces" && <PlaceholderTab title="워크스페이스" desc="팀 단위 워크스페이스 관리" icon="building"/>}
            {tab === "runs"      && <PlaceholderTab title="실행 내역" desc="모든 워크플로우 실행 로그" icon="activity"/>}
            {tab === "plans"     && <PlaceholderTab title="요금제" desc="요금제 정의와 가격 관리" icon="package"/>}
            {tab === "coupons"   && <PlaceholderTab title="쿠폰 · 크레딧" desc="프로모션 코드와 크레딧 정책" icon="ticket"/>}
            {tab === "logs"      && <PlaceholderTab title="감사 로그" desc="관리자 활동 기록" icon="file-text"/>}
            {tab === "announcements" && <PlaceholderTab title="공지 발송" desc="전체 사용자 · 그룹별 공지" icon="megaphone"/>}
            {tab === "settings"  && <PlaceholderTab title="설정" desc="관리자 콘솔 환경 설정" icon="settings"/>}
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

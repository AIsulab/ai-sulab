  @keyframes float { 0%,100%{transform: translateY(0)} 50%{transform: translateY(-4px)} }
  @keyframes hueShift { 0%,100%{filter: hue-rotate(0deg)} 50%{filter: hue-rotate(20deg)} }
  @keyframes blink { 50%{opacity:0.3} }
  @keyframes kenburns { 0%,100%{transform: scale(1.05) translate(0,0)} 50%{transform: scale(1.15) translate(-2%,1%)} }

  .anim-drift2 { animation: drift2 9s ease-in-out infinite; }
  .anim-shimmer { background-size: 200% 200%; animation: shimmerBg 6s linear infinite; }

  .anim-hue { animation: hueShift 8s ease-in-out infinite; }

const { useState, useEffect, useRef, useMemo } = React;

function Icon({ name, className = "w-5 h-5", strokeWidth = 1.75 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const key = name.replace(/(^|-)(\w)/g, (_, __, c) => c.toUpperCase());
      const svg = window.lucide.createElement(window.lucide.icons[key] || window.lucide.icons.Circle);
      svg.setAttribute("class", className);
      svg.setAttribute("stroke-width", strokeWidth);
      ref.current.appendChild(svg);
    }
  }, [name, className, strokeWidth]);
  return <span ref={ref} className="inline-flex" />;
}

          {/* prompt side */}
          <div className="p-6 flex flex-col bg-[#0d0d10]">
            <div className="flex items-center justify-between mb-3">
              <div className="inline-flex items-center gap-1.5">
                <Icon name="terminal" className="w-4 h-4 text-slate-400" />
                <span className="text-[13px] font-semibold text-white">전체 프롬프트</span>
              </div>
              {paid &&
              <button onClick={copyPrompt} className="inline-flex items-center gap-1 text-[12px] font-medium text-violet-300 hover:text-violet-200">
                  <Icon name={copied ? "check" : "copy"} className="w-3.5 h-3.5" />{copied ? "복사됨" : "복사"}
                </button>
              }
            </div>

            <div className="relative flex-1 min-h-[300px] rounded-2xl bg-black ring-1 ring-white/5 overflow-hidden">
              <div className="absolute inset-0 overflow-auto scrollbar-thin p-4 font-mono text-[12.5px] leading-relaxed text-slate-300 whitespace-pre-wrap">
{item.teaser}
                {!paid &&
                <span className="locked-blur">{item.locked}</span>
                }
                {paid && item.locked}
              </div>
              {!paid &&
              <>
                  <div className="absolute left-0 right-0 bottom-0 h-32 lock-fade-dark pointer-events-none"></div>
                  <div className="absolute inset-x-0 bottom-0 px-4 pb-4">
                    <div className="rounded-xl bg-[#13131a] ring-1 ring-violet-500/30 shadow-lg shadow-violet-500/10 p-3.5">
                      <div className="flex items-center gap-2">
                        <div className="w-9 h-9 rounded-lg bg-violet-500/20 text-violet-300 flex items-center justify-center shrink-0 ring-1 ring-violet-500/30">
                          <Icon name="lock" className="w-4 h-4" />
                        </div>
                        <div className="flex-1 min-w-0">
                          <div className="text-[13px] font-bold text-white">전체 프롬프트 잠금 상태</div>
                          <div className="text-[11.5px] text-slate-400">결제하면 즉시 전체 프롬프트를 복사할 수 있어요.</div>
                        </div>
                        <button onClick={pay} disabled={paying}
                      className="h-9 px-3.5 rounded-lg bg-gradient-to-r from-violet-500 to-fuchsia-500 hover:from-violet-400 hover:to-fuchsia-400 text-white text-[12.5px] font-bold inline-flex items-center gap-1.5 transition shadow-lg shadow-violet-500/30 shrink-0 disabled:opacity-70">
                          {paying ? <><Icon name="loader-2" className="w-3.5 h-3.5 animate-spin" />결제 중</> :
                        <>₩{item.price.toLocaleString()} <Icon name="arrow-right" className="w-3.5 h-3.5" /></>}
                        </button>
                      </div>
                    </div>
                  </div>
                </>
              }
              {paid &&
              <div className="absolute top-3 right-3 inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-emerald-500 text-slate-950 text-[10.5px] font-black">
                  <Icon name="check" className="w-3 h-3" strokeWidth={3} />UNLOCKED
                </div>
              }
            </div>

            {/* CTA below */}
            {!paid ?
            <div className="mt-4 grid grid-cols-2 gap-2">
                <button onClick={pay} disabled={paying}
              className="h-11 rounded-xl bg-white text-slate-900 text-[13px] font-bold inline-flex items-center justify-center gap-1.5 transition hover:bg-slate-100 disabled:opacity-70">
                  <Icon name="credit-card" className="w-4 h-4" /> 단건 ₩{item.price.toLocaleString()}
                </button>
                <button className="h-11 rounded-xl bg-gradient-to-r from-violet-500 to-fuchsia-500 hover:from-violet-400 hover:to-fuchsia-400 text-white text-[13px] font-bold inline-flex items-center justify-center gap-1.5 transition shadow-lg shadow-violet-500/30">
                  <Icon name="sparkles" className="w-4 h-4" /> 멤버십 ₩19,900/월
                </button>
                <div className="col-span-2 text-center text-[11.5px] text-slate-500">멤버십 가입 시 모든 프롬프트 무제한 + 매주 신규 50개</div>
              </div> :

            <div className="mt-4 grid grid-cols-2 gap-2">
                {item.buildable ?
              <button className="col-span-2 h-12 rounded-xl bg-gradient-to-r from-violet-500 via-fuchsia-500 to-orange-400 hover:brightness-110 text-white text-[14px] font-black inline-flex items-center justify-center gap-2 transition shadow-lg shadow-violet-500/30">
                    <Icon name="zap" className="w-4 h-4" /> 수랩 빌더로 즉시 빌드하기 <Icon name="arrow-right" className="w-4 h-4" />
                  </button> :
              null}
                <button onClick={copyPrompt} className="h-11 rounded-xl bg-white text-slate-900 text-[13px] font-bold inline-flex items-center justify-center gap-1.5 transition hover:bg-slate-100">
                  <Icon name={copied ? "check" : "copy"} className="w-4 h-4" /> {copied ? "복사됨" : "프롬프트 복사"}
                </button>
                <button className="h-11 rounded-xl bg-white/[0.05] ring-1 ring-white/10 hover:bg-white/[0.08] text-white text-[13px] font-medium inline-flex items-center justify-center gap-1.5 transition">
                  <Icon name="download" className="w-4 h-4" /> .txt 다운로드
                </button>
              </div>
            }
          </div>
        </div>
      </div>
    </div>);

}

// ============================================================
// FEATURED MASONRY
// ============================================================
function FeaturedRow({ items, onOpen }) {
  return (
    <section className="max-w-[1180px] mx-auto px-6 mb-10">
      <div className="grid lg:grid-cols-3 gap-3">
        {items.slice(0, 3).map((item) => {
          const Thumb = Thumbs[item.mock];
          return (
            <button key={item.id} onClick={() => onOpen(item)}
            className="group text-left relative rounded-2xl overflow-hidden ring-1 ring-white/5 hover:ring-violet-500/30 hover:shadow-xl hover:shadow-violet-500/15 transition card-dark">
              <div className="relative aspect-[16/9] overflow-hidden">
                {Thumb && <Thumb />}
              </div>
              <div className="p-3.5">
                <div className="flex items-center gap-1.5 mb-1">
                  <span className="text-[10px] font-black px-1.5 py-0.5 rounded bg-amber-500 text-slate-950 inline-flex items-center gap-0.5">
                    <Icon name="star" className="w-2.5 h-2.5" strokeWidth={3} />BEST
                  </span>
                  <span className="text-[10.5px] font-medium text-slate-400">{item.cat} · {item.tool}</span>
                </div>
                <h3 className="font-display font-bold text-[15px] mt-1 tracking-tight line-clamp-1 text-white">{item.title}</h3>
                <div className="mt-2 flex items-center justify-between">
                  <span className="text-[11.5px] text-slate-500 inline-flex items-center gap-2">
                    <span className="inline-flex items-center gap-0.5"><Icon name="heart" className="w-3 h-3" />{item.likes}</span>
                    <span className="inline-flex items-center gap-0.5"><Icon name="eye" className="w-3 h-3" />{item.views}</span>
                  </span>
                  <span className="font-grotesk font-bold text-[14px] font-mono-num text-white">₩{item.price.toLocaleString()}</span>
                </div>
              </div>
            </button>);

        })}
      </div>
    </section>);

}

// ============================================================
// APP
// ============================================================
function App() {
  const [cat, setCat] = useState("전체");
  const [sort, setSort] = useState("featured");
  const [query, setQuery] = useState("");
  const [layout, setLayout] = useState("grid");
  const [open, setOpen] = useState(null);
  const [owned, setOwned] = useState(() => {
    try {const stored = localStorage.getItem("sulab.owned");return stored ? JSON.parse(stored) : [];}
    catch {return [];}
  });

  const isOwned = (id) => owned.includes(id);
  function unlock(id) {
    setOwned((prev) => {
      const next = prev.includes(id) ? prev : [...prev, id];
      try {localStorage.setItem("sulab.owned", JSON.stringify(next));} catch {}
      return next;
    });
  }

  const featured = ITEMS.filter((i) => i.featured);

  const filtered = useMemo(() => {
    let list = ITEMS.slice();
    if (cat !== "전체") list = list.filter((i) => i.cat === cat);
    if (query) {
      const q = query.toLowerCase();
      list = list.filter((i) => (i.title + i.desc + i.tool + i.tag).toLowerCase().includes(q));
    }
    if (sort === "popular") list.sort((a, b) => b.likes - a.likes);else
    if (sort === "price-asc") list.sort((a, b) => a.price - b.price);else
    if (sort === "price-desc") list.sort((a, b) => b.price - a.price);else
    if (sort === "newest") list.reverse();else
    list.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
    return list;
  }, [cat, query, sort]);

  return (
    <div className="min-h-screen nav-host">
      <SulabNav active="portfolio" />
      <Hero ownedCount={owned.length} totalCount={ITEMS.length} />
      <FeaturedRow items={featured} onOpen={setOpen} />
      <Filters cat={cat} setCat={setCat} sort={sort} setSort={setSort} query={query} setQuery={setQuery} layout={layout} setLayout={setLayout} />

      <section className="max-w-[1180px] mx-auto px-6 pb-16" data-screen-label="02 Gallery">
        {filtered.length === 0 ?
        <div className="card-dark rounded-2xl p-16 text-center">
            <div className="text-slate-500 text-[14px]">조건에 맞는 프롬프트가 없습니다.</div>
          </div> :
        layout === "grid" ?
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {filtered.map((item) =>
          <PromptCard key={item.id} item={item} owned={isOwned(item.id)} onOpen={() => setOpen(item)} layout="grid" />
          )}
          </div> :

        <div className="space-y-3">
            {filtered.map((item) =>
          <PromptCard key={item.id} item={item} owned={isOwned(item.id)} onOpen={() => setOpen(item)} layout="list" />
          )}
          </div>
        }
      </section>

      {/* CTA */}
      <section id="membership" className="max-w-[1180px] mx-auto px-6 pb-20">
        <div className="relative overflow-hidden rounded-3xl p-10 md:p-14 text-center ring-1 ring-white/10" style={{ background: "radial-gradient(ellipse at 30% 0%, rgba(167,139,250,0.3), transparent 60%), radial-gradient(ellipse at 70% 100%, rgba(251,146,60,0.25), transparent 60%), #0d0a1a" }}>
          <div className="absolute -top-24 -left-20 w-[400px] h-[400px] rounded-full bg-violet-500/20 blur-3xl"></div>
          <div className="absolute -bottom-24 -right-20 w-[400px] h-[400px] rounded-full bg-orange-500/15 blur-3xl"></div>
          <div className="relative z-10 max-w-[620px] mx-auto">
            <span className="inline-flex px-3 py-1 rounded-full bg-white/[0.06] ring-1 ring-white/10 text-white text-[12px] font-semibold tracking-wider uppercase">멤버십</span>
            <h2 className="font-display font-extrabold text-[32px] md:text-[44px] leading-[1.08] mt-4 tracking-tight text-white">
              매번 결제 대신<br />월 <span className="gradient-text font-grotesk">₩19,900</span>으로 전부.
            </h2>
            <p className="text-slate-300 text-[15px] mt-4">모든 프롬프트 무제한 + 매주 신규 50개 + 수랩 빌더 + 상업적 이용.</p>
            <div className="mt-7 flex items-center justify-center gap-2 flex-wrap">
              <a href="Sulab Signup.html" className="inline-flex items-center gap-2 h-12 px-6 rounded-xl bg-white text-slate-900 font-black text-[15px] hover:bg-slate-100 transition shadow-lg shadow-violet-500/30">
                멤버십 시작 <Icon name="sparkles" className="w-4 h-4" />
              </a>
              <a href="Sulab Landing.html#pricing" className="inline-flex items-center gap-2 h-12 px-5 rounded-xl bg-white/[0.06] ring-1 ring-white/15 text-white font-semibold text-[15px] hover:bg-white/10 transition">
                요금제 비교
              </a>
            </div>
          </div>
        </div>
      </section>

      {open && <DetailModal item={open} onClose={() => setOpen(null)} owned={isOwned(open.id)} onUnlock={unlock} />}
    </div>);

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

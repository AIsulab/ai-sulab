<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

// ---------- Lucide helper ----------
function Icon({ name, className = "w-5 h-5", strokeWidth = 1.75 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const svg = window.lucide.createElement(window.lucide.icons[
        name.replace(/(^|-)(\w)/g, (_, __, c) => c.toUpperCase())
      ] || window.lucide.icons.Circle);
      svg.setAttribute("class", className);
      svg.setAttribute("stroke-width", strokeWidth);
      ref.current.appendChild(svg);
    }
  }, [name, className, strokeWidth]);
  return <span ref={ref} className="inline-flex" />;
}

// ---------- Brand logo ----------
function Logo({ light = false, size = 28 }) {
  return (
    <img
      src="assets/sulab-logo.png"
      alt="sulab"
      draggable="false"
      style={{ height: size + "px", width: "auto", filter: light ? "brightness(0) invert(1)" : "none" }}
      className="block select-none"
    />
  );
}

            </form>

            {/* divider */}

            {/* social */}

                  <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.2 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/>

name: Auto Blogger Posting

on:
  schedule:
    # 매일 한국 시간 기준 아침 8시(UTC 23:00)와 오후 6시(UTC 09:00)에 실행
    - cron: '0 23,9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Post mode (auto or custom)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - custom
      keyword:
        description: 'Custom Keyword (used if mode is custom)'
        required: false
        type: string
      topic:
        description: 'Custom Topic (used if mode is custom)'
        required: false
        type: string
      publish_now:
        description: 'Publish immediately (true/false)'
        required: false
        default: true
        type: boolean

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: Node.js 세팅
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 패키지 설치
      run: npm install

    - name: 자동 포스팅 스크립트 실행
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        POST_MODE: ${{ inputs.mode || 'auto' }}
        CUSTOM_KEYWORD: ${{ inputs.keyword || '' }}
        CUSTOM_TOPIC: ${{ inputs.topic || '' }}
        PUBLISH_NOW: ${{ inputs.publish_now }}
      run: node auto_post.js
